services:
  - type: web
    name: meridiandesk-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: meridiandesk
          property: connectionString
      - key: SEED_ON_START
        value: "true"
